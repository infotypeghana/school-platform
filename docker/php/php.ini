; ── SchoolMS Ghana — Production PHP.ini ──────────────────────────────────────

[PHP]
; Security
expose_php        = Off
display_errors    = Off
log_errors        = On
error_log         = /var/www/html/storage/logs/php-error.log

; Limits
memory_limit           = 256M
max_execution_time     = 120
max_input_time         = 60
max_input_vars         = 3000
post_max_size          = 12M
upload_max_filesize    = 10M

; Session hardening
session.cookie_httponly = 1
session.cookie_secure   = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.gc_maxlifetime  = 7200

[opcache]
opcache.enable                 = 1
opcache.enable_cli             = 0
opcache.memory_consumption     = 256
opcache.interned_strings_buffer= 16
opcache.max_accelerated_files  = 20000
opcache.validate_timestamps    = 0    ; Never reload files — deploy handles cache clear
opcache.revalidate_freq        = 0
opcache.save_comments          = 1    ; Required by Laravel's DI container annotations
opcache.fast_shutdown          = 1
