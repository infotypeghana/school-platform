; ── SchoolMS Ghana — PHP-FPM pool configuration ─────────────────────────────

[www]
user  = www-data
group = www-data

listen = 0.0.0.0:9000

; Dynamic scaling — adjust pm.max_children to available RAM
; Rule of thumb: max_children = (RAM_MB - 128) / 30
pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests      = 500

; Logging
access.log          = /proc/self/fd/2
php_admin_flag[log_errors] = on
catch_workers_output = yes
decorate_workers_output = no

; Security
security.limit_extensions = .php
