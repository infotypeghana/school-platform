# ──────────────────────────────────────────────────────────────────────────────
# SchoolMS Ghana — Nginx configuration (Docker)
# Handles: wildcard subdomain routing, SSL termination, security headers
# ──────────────────────────────────────────────────────────────────────────────

# Redirect bare HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# Main HTTPS server — wildcard *.schoolms.com.gh + custom domains
server {
    listen 443 ssl;
    http2 on;

    # Wildcard cert — covers *.schoolms.com.gh
    server_name *.schoolms.com.gh schoolms.com.gh;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    root   /var/www/html/public;
    index  index.php;

    # Max upload size (report cards, logo, CSV import)
    client_max_body_size 10M;

    # Gzip compression
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1000;
    gzip_types        text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Deny hidden files (except .well-known for certbot)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Static assets — long cache, served directly by Nginx
    location ~* \.(css|js|woff|woff2|ttf|otf|eot|ico|png|jpg|jpeg|gif|webp|svg|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Laravel storage symlink
    location /storage/ {
        try_files $uri =404;
    }

    # PHP — pass to PHP-FPM
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass   app:9000;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO       $fastcgi_path_info;
        fastcgi_read_timeout 120;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }
}
