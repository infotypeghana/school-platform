name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: PHP ${{ matrix.php }} — Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.4"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, posix, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env

          # CI has no Redis — override drivers so artisan commands can boot
          # (phpunit.xml already sets CACHE_STORE=array / SESSION_DRIVER=array
          #  for the actual test run, so these only affect pre-test artisan calls)
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/'    .env
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=file/'          .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env

          # CI has no MySQL — use SQLite for the migrate:fresh step
          # (phpunit.xml overrides this to :memory: for the actual test run)
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/'    .env
          sed -i 's|^DB_DATABASE=.*|DB_DATABASE=database/ci.sqlite|' .env
          touch database/ci.sqlite

          php artisan key:generate

      - name: Run schema migration
        run: php artisan migrate:fresh --force

      - name: Run tests
        run: php artisan test --stop-on-failure

  analyse:
    name: PHPStan Static Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, posix, pdo, sqlite, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-8.4-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-8.4-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/'    .env
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=file/'          .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/'    .env
          sed -i 's|^DB_DATABASE=.*|DB_DATABASE=database/ci.sqlite|' .env
          touch database/ci.sqlite
          php artisan key:generate

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress --error-format=github

  security:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit Composer packages for known vulnerabilities
        run: composer audit --format=plain

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, analyse, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          port:     ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/var/www/schoolms' }}

            # Pull latest code
            git pull origin main

            # Install/update dependencies (no dev packages)
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            # Run migrations safely
            php artisan migrate --force

            # Rebuild caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # Restart queue workers gracefully
            php artisan horizon:terminate
            sleep 5

            echo "Deploy complete at $(date)"
