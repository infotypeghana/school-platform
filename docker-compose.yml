services:

  # ── PHP-FPM Application ──────────────────────────────────────────────────────
  app:
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file: .env
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - schoolms
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Nginx Web Server ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
      - nginx_certs:/etc/nginx/certs
    networks:
      - schoolms
    depends_on:
      - app

  # ── MySQL Database ────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-schoolms}
      MYSQL_USER: ${DB_USERNAME:-schoolms}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/schoolms.cnf:ro
    networks:
      - schoolms
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME:-schoolms}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis (queue + cache + sessions) ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - schoolms
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Laravel Horizon (queue worker) ────────────────────────────────────────────
  horizon:
    build:
      context: .
      target: production
    restart: unless-stopped
    command: php artisan horizon
    env_file: .env
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - schoolms
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Laravel Scheduler ────────────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      target: production
    restart: unless-stopped
    command: >
      sh -c "while true; do
        php artisan schedule:run --no-interaction
        sleep 60
      done"
    env_file: .env
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - schoolms
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
  app_storage:
  nginx_certs:

networks:
  schoolms:
    driver: bridge
