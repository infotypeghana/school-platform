<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline — SchoolMS Ghana</title>
<style>
  body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f9fafb;color:#111827}
  .card{text-align:center;padding:2rem;max-width:400px}
  .icon{font-size:4rem;margin-bottom:1rem}
  h1{font-size:1.5rem;margin:0 0 .5rem}
  p{color:#6b7280;margin:0 0 1.5rem}
  button{background:#1a56db;color:#fff;border:none;padding:.6rem 1.4rem;border-radius:6px;cursor:pointer;font-size:1rem}
  button:hover{background:#1e429f}
</style>
</head>
<body>
<div class="card">
  <div class="icon">📶</div>
  <h1>You're offline</h1>
  <p>Please check your internet connection and try again.</p>
  <button onclick="window.location.reload()">Try again</button>
</div>
</body>
</html>
