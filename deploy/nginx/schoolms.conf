# SchoolMS Ghana — Nginx site config
# Place at: /etc/nginx/sites-available/schoolms
# Enable:   sudo ln -s /etc/nginx/sites-available/schoolms /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name *.schoolms.com.gh schoolms.com.gh;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server — wildcard *.schoolms.com.gh
server {
    listen 443 ssl;
    http2 on;

    server_name *.schoolms.com.gh schoolms.com.gh;

    # Wildcard SSL (Let's Encrypt via DNS challenge)
    ssl_certificate     /etc/letsencrypt/live/schoolms.com.gh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/schoolms.com.gh/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS — 1 year, subdomains (also set in SecureHeadersMiddleware)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    root  /var/www/schoolms/public;
    index index.php;

    # 10 MB — covers logo uploads, CSV imports, PDF generation
    client_max_body_size 10M;

    # Gzip
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1000;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml image/svg+xml font/woff2;

    # Block hidden files (except Let's Encrypt challenge)
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # Versioned static assets — immutable cache
    location ~* \.(css|js|woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Media/images
    location ~* \.(ico|png|jpg|jpeg|gif|webp|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Laravel storage (photos, exports accessible via storage link)
    location /storage/ {
        try_files $uri =404;
    }

    # Main Laravel entry point
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass   unix:/run/php/php8.4-fpm.sock;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout     120;
        fastcgi_buffer_size      16k;
        fastcgi_buffers          4 16k;

        # PHP-FPM does not pass sensitive headers to scripts
        fastcgi_hide_header X-Powered-By;
    }

    # Deny PHP execution in storage
    location ~ ^/storage/.*\.php$ {
        deny all;
    }

    # Laravel Horizon — super admin only (auth enforced in app, IP restriction here for extra hardening)
    # Uncomment and set your server IP to restrict /horizon to admin IPs:
    # location /horizon {
    #     allow 196.x.x.x;
    #     deny all;
    #     try_files $uri $uri/ /index.php?$query_string;
    # }
}
