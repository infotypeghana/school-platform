[program:schoolms-horizon]
; ── Laravel Horizon — queue worker supervisor ─────────────────────────────────
; Place this file at: /etc/supervisor/conf.d/schoolms-horizon.conf
; Then run:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start schoolms-horizon:*

; The command Horizon recommends — sends SIGTERM on stop so workers drain cleanly
command=php /var/www/schoolms/artisan horizon

; Run as the web server user (never root)
user=www-data

; Keep alive automatically
autostart=true
autorestart=true

; Number of Horizon master processes (always 1 — Horizon manages its own workers)
numprocs=1

; Redirect stdout + stderr to a log file supervisor can rotate
redirect_stderr=true
stdout_logfile=/var/www/schoolms/storage/logs/horizon.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

; How long (seconds) to wait for Horizon to drain workers before force-killing
; Horizon's default drain timeout is 60 s — give it a comfortable margin
stopwaitsecs=120
stopsignal=SIGTERM

; Allow Horizon to start within 5 seconds or supervisord marks it crashed
startsecs=5
startretries=3
